buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'

version = '1.0.0'
group = 'com.bromax.bromaxlib'
archivesBaseName = 'bromaxlib'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2859'
    // Mixin is provided at runtime by MixinBooter — compile-only.
    compileOnly files('/home/glenn/Documents/curseforge/minecraft/Instances/Sovereign 101/mods/!mixinbooter-10.7.jar')
}

jar {
    manifest {
        attributes([
            'MixinConfigs'  : 'bromaxlib.mixins.json',
            'FMLCorePlugin' : 'com.bromax.bromaxlib.asm.BromaxLibCorePlugin',
            'FMLCorePluginContainsFMLMod': 'true'
        ])
    }
}

jar.finalizedBy('reobfJar')

task deploy {
    doLast {
        copy {
            from 'build/libs/bromaxlib-1.0.0.jar'
            into '/home/glenn/Documents/curseforge/minecraft/Instances/Sovereign 101/mods'
        }
        println "[DEPLOY] bromaxlib → S101"
    }
}
build.finalizedBy(deploy)

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', '1.12.2'

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': '1.12.2'
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}
